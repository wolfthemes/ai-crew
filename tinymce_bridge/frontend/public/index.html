<!DOCTYPE html>
<html>
<head>
  <script src="https://unpkg.com/@streamlit/component-lib/dist/index.umd.js"></script>
</head>
<body>
  <script>
    const reply = localStorage.getItem("tinymce_reply") || "";
    window.addEventListener("load", () => {
      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(0);
      Streamlit.setComponentValue(reply);
    });
  </script>
</body>
</html>
