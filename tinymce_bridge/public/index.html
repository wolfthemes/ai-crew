<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <script>
    const value = localStorage.getItem("tinymce_reply") || "";
    console.log( value )
    // Streamlit will inject this object into the iframe
    window.addEventListener("message", (event) => {
      if (event.data.type === "streamlit:render") {
        const content = localStorage.getItem("tinymce_reply");
        event.source.postMessage({
          type: "streamlit:componentValue",
          value: content,
          id: event.data.id
        }, "*");
      }
    });

    window.addEventListener("load", () => {
      document.body.innerHTML = localStorage.getItem("tinymce_reply")  + "<code>📤 Sending TinyMCE reply...</code>";
    });
  </script>
</head>

<body></body>

</html>
