<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>AI Crew Dashboard</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #121212;
            color: white;
        }

        .tabs {
            display: flex;
            background: #1e1e1e;
            height: 42px;
        }

        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #1e1e1e;
            color: white;
            border-right: 1px solid #333;
        }

        .tab.active {
            background: #333;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 42px);
            border: none;
            display: none;
        }

        iframe.active {
            display: block;
        }
    </style>
</head>

<body>
    <div class="tabs">
        <div class="tab" onclick="switchTab(0)">Dev Agent</div>
        <div class="tab" onclick="switchTab(1)">Fresh Ticket</div>
        <div class="tab active" onclick="switchTab(2)">Ticket Dashboard</div>
    </div>

    <iframe src="http://localhost:8501"></iframe>
    <iframe src="http://localhost:8502"></iframe>
    <iframe class="active" src="http://localhost:8503"></iframe>

    <script>
        function switchTab(index) {
            const tabs = document.querySelectorAll('.tab');
            const frames = document.querySelectorAll('iframe');
            tabs.forEach((tab, i) => tab.classList.toggle('active', i === index));
            frames.forEach((frame, i) => frame.classList.toggle('active', i === index));
        }
    </script>
</body>

</html>
