<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="ai_crew_dashboard_icon.ico">
    <title>AI Dev Chat</title>
    <style>
        body {
            margin: 0;
            font-family: sans-serif;
            background: #121212;
            color: white;
            overflow: hidden;
        }
    
        .tabs {
            display: flex;
            background: #1e1e1e;
            height: 42px;
            border-bottom: 1px solid #333;
        }
    
        .tab {
            padding: 10px 20px;
            cursor: pointer;
            background: #1e1e1e;
            color: white;
            border-right: 1px solid #333;
            user-select: none;
            transition: background 0.2s;
        }
    
        .tab:hover {
            background: #2a2a2a;
        }
    
        .tab.active {
            background: #333;
            font-weight: bold;
        }
    
        .iframe-container {
            width: 100%;
            /* height: calc(100vh - 43px); */
            height: 100vh;
            overflow: hidden;
            position: relative;
        }
    
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    
        iframe.active {
            opacity: 1;
            pointer-events: auto;
        }
    
        .loading-indicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 18px;
            color: #aaa;
        }
    </style>
</head>
    <body>
        <div class="iframe-container">
            <div class="loading-indicator">Loading apps...</div>
            <iframe data-src="http://localhost:8503" class="active" src="http://localhost:8503"></iframe>
        </div>
    </body>
